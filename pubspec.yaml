name: resident_app
description: UrbanEasyFlats Resident App — native Flutter app for tenants and residents.
publish_to: 'none'
version: 1.0.0+44
environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2
  http: ^1.2.0
  pdf: ^3.11.3
  printing: ^5.14.3
  razorpay_flutter: ^1.4.3
  url_launcher: ^6.3.1
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  excel: ^4.0.6
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  connectivity_plus: ^6.0.1
  open_filex: ^4.7.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  in_app_update: ^4.2.3
  sms_autofill: ^2.4.1
  mobile_number: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F5D547"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/tenenet_logo.jpg
    - assets/icon/
    - assets/login_hero.png
